[package]
name = "storage-analyzer"
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
description = "Disk-usage TUI (placeholder name)"
publish = false

[lib]
name = "storage_analyzer"
path = "src/lib.rs"

[[bin]]
name = "storage-analyzer"
path = "src/main.rs"

[dependencies]
rustix = { version = "1", features = ["fs", "process", "thread"] }
ratatui = "0.30"
crossterm = "0.29"
clap = { version = "4", features = ["derive"] }
unicode-width = "0.2"
smallvec = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
signal-hook = "0.3"

[dev-dependencies]
proptest = "1"
tempfile = "3"
insta = "1"
assert_cmd = "2"
