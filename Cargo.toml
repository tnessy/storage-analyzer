[package]
name = "storage-analyzer"
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
description = "Disk-usage TUI for Linux: directory tree plus treemap, live while it scans"
license = "MIT OR Apache-2.0"
readme = "README.md"
repository = "https://github.com/tnessy/storage-analyzer"
keywords = ["disk-usage", "tui", "treemap", "du", "cleanup"]
categories = ["command-line-utilities", "filesystem"]
# Ship only what `cargo install` needs; tests, docs, spikes and examples stay in the repo.
include = ["/src/**", "/Cargo.toml", "/Cargo.lock", "/README.md", "/LICENSE-MIT", "/LICENSE-APACHE"]

[lib]
name = "storage_analyzer"
path = "src/lib.rs"

[[bin]]
name = "storage-analyzer"
path = "src/main.rs"

[dependencies]
rustix = { version = "1", features = ["fs", "process", "thread"] }
ratatui = "0.30"
crossterm = "0.29"
clap = { version = "4", features = ["derive"] }
unicode-width = "0.2"
smallvec = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
signal-hook = "0.3"

[dev-dependencies]
proptest = "1"
tempfile = "3"
insta = "1"
assert_cmd = "2"
# T031 measurement only (examples/scan_harness.rs); not used by the shipped binary.
libc = "0.2"
mimalloc = { version = "0.1", default-features = false }
