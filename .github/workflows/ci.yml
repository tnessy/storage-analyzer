name: CI

# Every branch: format, lint, build, test, package.
# main only: if the version in Cargo.toml is not on crates.io yet, tag it and publish it.
# To release, bump `version` in Cargo.toml (and Cargo.lock) and land that on main.

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_TOOLCHAIN: "1.99"

jobs:
  ci:
    name: Build and test
    # Pull requests from this repo are already covered by the push run.
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Format
        run: cargo fmt --check
      - name: Lint
        run: cargo clippy --all-targets --locked -- -D warnings
      - name: Build
        run: cargo build --release --locked
      - name: Test
        run: cargo test --locked --no-fail-fast
      - name: Package
        run: cargo package --locked

  release:
    name: Tag and publish
    needs: ci
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    # One release at a time; a second push waits instead of racing the first.
    concurrency:
      group: release
      cancel-in-progress: false
    permissions:
      contents: write # push the tag
      id-token: write # crates.io Trusted Publishing
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}

      - name: Decide what to release
        id: plan
        run: |
          meta=$(cargo metadata --no-deps --format-version 1 --locked)
          name=$(jq -r '.packages[0].name' <<<"$meta")
          version=$(jq -r '.packages[0].version' <<<"$meta")
          tag="v$version"

          status=$(curl -sS -o /dev/null -w '%{http_code}' \
            -A "$name release workflow" \
            "https://crates.io/api/v1/crates/$name/$version")
          case "$status" in
            200) published=true ;;
            404) published=false ;;
            *) echo "::error::crates.io answered HTTP $status for $name $version"; exit 1 ;;
          esac

          remote_tag=$(git ls-remote --tags origin "refs/tags/$tag")
          tag_sha=${remote_tag%%[[:space:]]*}

          create_tag=false
          if [ -z "$tag_sha" ]; then
            create_tag=true
          elif [ "$published" = false ] && [ "$tag_sha" != "$GITHUB_SHA" ]; then
            echo "::error::Tag $tag already exists on another commit ($tag_sha) but $version is not on crates.io. Bump the version in Cargo.toml."
            exit 1
          fi

          publish=false
          if [ "$published" = false ]; then publish=true; fi

          {
            echo "tag=$tag"
            echo "create_tag=$create_tag"
            echo "publish=$publish"
          } >>"$GITHUB_OUTPUT"
          echo "$name $version: on crates.io=$published, tag ${tag_sha:-missing}; create_tag=$create_tag, publish=$publish" | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Create tag
        if: steps.plan.outputs.create_tag == 'true'
        run: |
          git tag "${{ steps.plan.outputs.tag }}" "$GITHUB_SHA"
          git push origin "refs/tags/${{ steps.plan.outputs.tag }}"

      - name: Authenticate with crates.io
        if: steps.plan.outputs.publish == 'true'
        id: auth
        uses: rust-lang/crates-io-auth-action@v1

      - name: Publish to crates.io
        if: steps.plan.outputs.publish == 'true'
        run: cargo publish --locked
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
